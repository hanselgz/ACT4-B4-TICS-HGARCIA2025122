<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de Videojuegos - Act 4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Explorador de Videojuegos</h1>
    <p>Actividad 4 - Consumo de API con Fetch y JS Puro</p>
  </header>

  <main>
    <section class="search-section">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Buscar videojuego famoso..." 
        autocomplete="off"
      >
    </section>

    <div id="status-message" class="status-message">Cargando videojuegos...</div>

    <section id="games-container" class="games-grid"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
